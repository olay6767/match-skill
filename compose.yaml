services:
  mariadb:
    image: mariadb:12.3.2
    container_name: match-skill-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env.database}
      MARIADB_DATABASE: match_skill
      MARIADB_USER: match_skill_app
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env.database}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - match_skill_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    container_name: match-skill-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL:-http://localhost:5173}
      USER_FRONTEND_URL: ${USER_FRONTEND_URL:-http://localhost:5174}
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: match_skill_app
      DB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env.database}
      DB_NAME: match_skill
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.database (at least 32 characters)}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@matchskill.com}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-admin1234}
      DEV_ADMIN_NAME: ${DEV_ADMIN_NAME:-Local Administrator}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: .
      target: admin
    container_name: match-skill-admin
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  user:
    build:
      context: .
      target: user
    container_name: match-skill-user
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  match_skill_mariadb_data:
